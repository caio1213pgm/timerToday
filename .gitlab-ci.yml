stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
    - echo "build successful"

test:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint
    - echo "lint successful"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$SSH_PRIVATE_KEY_TT"
    - ssh-keygen -y -f "$SSH_PRIVATE_KEY_TT" > /dev/null
    - echo "Chave SSH válida"
  script:
    - echo "Chave SSH carregada com sucesso"
