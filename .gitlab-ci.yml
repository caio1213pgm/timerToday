stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
    - echo "build successful"

test:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint
    - echo "lint successful"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_TT" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$VPS_HOST_TT" >> ~/.ssh/known_hosts
  script:
    - ssh "$VPS_USER_TT@$VPS_HOST_TT" "cd /home/caio/projetos/timerToday && git pull origin main"
    - ssh "$VPS_USER_TT@$VPS_HOST_TT" "docker stop timertoday || true"
    - ssh "$VPS_USER_TT@$VPS_HOST_TT" "docker rm timertoday || true"
    - ssh "$VPS_USER_TT@$VPS_HOST_TT" "docker run -d --name timertoday -p 3000:80 --restart unless-stopped timertoday:latest"
