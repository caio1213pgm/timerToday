stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
    - echo "build successful"

test:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint
    - echo "lint successful"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - install -m 600 "$SSH_PRIVATE_KEY_TT" ~/.ssh/id_ed25519
    - ssh-keygen -l -f ~/.ssh/id_ed25519
  script:
    - echo "Chave SSH carregada com sucesso"
