stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
    - echo "build successful"

test:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint
    - echo "lint successful"

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $VPS_USER@$VPS_HOST "
        cd /home/caio/projetos/timertoday-docker &&
        git pull origin main &&
        docker build -t timertoday-app . &&
        docker stop timertoday || true &&
        docker rm timertoday || true &&
        docker run -d --name timertoday -p 127.0.0.1:3000:80 --restart unless-stopped timertoday-app"
