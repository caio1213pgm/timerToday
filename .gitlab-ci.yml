stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
    - echo "build successful"

test:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint
    - echo "lint successful"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - test -f "$SSH_PRIVATE_KEY_TT" && echo "Arquivo existe"
    - test -s "$SSH_PRIVATE_KEY_TT" && echo "Arquivo não está vazio"
    - head -n 1 "$SSH_PRIVATE_KEY_TT" | grep -q "BEGIN OPENSSH PRIVATE KEY" && echo "Cabeçalho válido"
    - tail -n 1 "$SSH_PRIVATE_KEY_TT" | grep -q "END OPENSSH PRIVATE KEY" && echo "Rodapé válido"

    - install -m 600 "$SSH_PRIVATE_KEY_TT" ~/.ssh/id_ed25519
    - ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
  script:
    - echo "Chave SSH carregada com sucesso"
